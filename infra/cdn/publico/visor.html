<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123d43" />
    <title>Tu zona · Vecinal</title>
    <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
    <style>
      :root {
        color-scheme: light;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #183c42;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9eee6;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      main {
        position: relative;
        height: 100dvh;
        min-height: 440px;
        overflow: hidden;
      }
      .panel {
        background: #fff;
        border: 1px solid #d6e1dc;
        box-shadow: 0 6px 30px #183c4214;
        border-radius: 20px;
      }
      header {
        position: absolute;
        top: 24px;
        left: 24px;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 18px 24px 18px 18px;
        max-width: calc(100% - 120px);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        color: #fff;
        background: #176b60;
        flex-shrink: 0;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.14em;
        font-weight: 700;
        color: #48706c;
        text-transform: uppercase;
      }
      h1 {
        font-size: 20px;
        letter-spacing: -0.03em;
        line-height: 1.25;
        margin: 4px 0 0;
      }
      .information {
        position: absolute;
        bottom: 38px;
        left: 24px;
        width: 310px;
        max-width: calc(100% - 48px);
        padding: 22px;
      }
      .information h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .information p {
        margin: 0;
        font-size: 14px;
        color: #4c6465;
      }
      #status {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid #e3eae6;
        font-size: 13px;
      }
      #status::before {
        content: "";
        width: 8px;
        height: 8px;
        flex-shrink: 0;
        background: #467872;
        border-radius: 50%;
      }
      #status[data-error] {
        color: #9c2b22;
      }
      #status[data-error]::before {
        background: #9c2b22;
      }
      button.locate {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        border: 1px solid #c7d9d1;
        background: #f1f6f3;
        color: #183c42;
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        border-radius: 12px;
        min-height: 48px;
        padding: 8px 16px;
        margin-top: 18px;
        width: 100%;
        cursor: pointer;
      }
      button.locate:hover {
        background: #e4eee8;
      }
      button:focus-visible {
        outline: 3px solid #176b60;
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .maplibregl-ctrl-top-right {
        top: 14px;
        right: 14px;
      }
      .maplibregl-ctrl-group {
        border-radius: 14px;
        overflow: hidden;
      }
      .maplibregl-ctrl-group button {
        width: 48px;
        height: 48px;
      }
      .maplibregl-ctrl-attrib {
        font-size: 12px;
      }
      @media (max-width: 600px) {
        header {
          top: 16px;
          left: 16px;
          padding: 12px 16px 12px 12px;
          gap: 10px;
          max-width: calc(100% - 90px);
          border-radius: 16px;
        }
        h1 {
          font-size: 17px;
        }
        .mark {
          width: 40px;
          height: 40px;
          border-radius: 12px;
        }
        .eyebrow {
          font-size: 10px;
        }
        .information {
          left: 16px;
          bottom: 48px;
          max-width: calc(100% - 32px);
          padding: 16px;
          width: 280px;
          border-radius: 16px;
        }
        .maplibregl-ctrl-top-right {
          top: 6px;
          right: 6px;
        }
      }
      @media (max-height: 580px) {
        .information {
          width: 280px;
        }
        .information h2,
        .information > p {
          display: none;
        }
        #status {
          margin: 0;
          padding: 0;
          border: 0;
        }
      }
    </style>
    <script src="/visor.js?v=3" type="module"></script>
  </head>
  <body>
    <main>
      <div
        id="map"
        role="region"
        aria-label="Mapa de demostración de Lince"
      ></div>
      <header class="panel">
        <span class="mark" aria-hidden="true"
          ><svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16M15 5v16" /></svg
        ></span>
        <div>
          <div class="eyebrow">Vecinal · tu zona</div>
          <h1>Lince y alrededores</h1>
        </div>
      </header>
      <aside class="information panel" aria-label="Información del mapa">
        <h2>Explora tu barrio</h2>
        <p>
          Desplázate por el mapa para conocer la zona. El área de demostración
          no representa límites oficiales.
        </p>
        <div id="status" role="status" aria-live="polite">
          Cargando el mapa…
        </div>
        <button class="locate" id="recenter" disabled>
          <span aria-hidden="true">⌖</span> Volver a mi zona
        </button>
      </aside>
    </main>
  </body>
</html>
