# "CDN" local: archivos estáticos con Range (PMTiles) y CORS para la app.
server {
  listen 80;
  root /usr/share/nginx/html;

  # MapLibre Native descarga regiones offline desde XYZ, no desde pmtiles://.
  # El archivo PMTiles es el mismo que se sirve públicamente con Range.
  location /teselas/ {
    proxy_pass http://teselas:8080/distrito/;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=300" always;
  }

  location / {
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  types {
    application/vnd.pmtiles pmtiles;
    application/json json;
    text/html html;
    text/css css;
    application/javascript js mjs;
    image/png png;
    application/x-protobuf pbf mvt;
    text/plain txt;
  }
}
