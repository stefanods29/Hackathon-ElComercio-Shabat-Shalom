receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "deployment.environment.name"])
      - context: span
        statements:
          - keep_keys(attributes, ["http.route", "http.request.method", "outcome"])
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "deployment.environment.name"])
      - context: datapoint
        statements:
          - keep_keys(attributes, ["http.route", "http.request.method", "outcome"])
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "deployment.environment.name"])
      - context: log
        statements:
          - keep_keys(attributes, ["http.route", "error.type"])
          - set(body, "technical_event")
  batch:
    timeout: 5s
    send_batch_size: 128
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      {
        receivers: [otlp],
        processors: [memory_limiter, transform/privacy, batch],
        exporters: [debug],
      }
    metrics:
      {
        receivers: [otlp],
        processors: [memory_limiter, transform/privacy, batch],
        exporters: [debug],
      }
    logs:
      {
        receivers: [otlp],
        processors: [memory_limiter, transform/privacy, batch],
        exporters: [debug],
      }
