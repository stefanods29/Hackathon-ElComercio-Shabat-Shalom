# Infraestructura local de la Fase 0: PostgreSQL + PostGIS (replicación lógica), PowerSync y una
# "CDN" estática para teselas PMTiles y JSON de emergencia.
#
#   cd infra && docker compose up -d
#   cd ../backend && npm run dev:keys && npm run db:migrate && npm run db:seed && npm run start:dev
#
# PowerSync valida los tokens con el JWKS de la API que corre en tu máquina (puerto 3000).
name: vecinal

services:
  postgres:
    # PostgreSQL 18 + PostGIS 3.6, como en producción (sección 13.2 y ADR-0007).
    image: postgis/postgis:18-3.6
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: vecinal
      POSTGRES_PASSWORD: vecinal
      POSTGRES_DB: vecinal
    ports:
      - "5432:5432"
    volumes:
      - pg_datos:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vecinal -d vecinal"]
      interval: 5s
      timeout: 5s
      retries: 10

  powersync:
    image: journeyapps/powersync-service:latest
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: postgresql://powersync_rol:powersync@postgres:5432/vecinal
      PS_STORAGE_SOURCE_URI: postgresql://vecinal:vecinal@postgres:5432/powersync_almacen
      PS_JWKS_URL: ${PS_JWKS_URL:-http://host.docker.internal:3000/.well-known/jwks.json}
      PS_PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./powersync:/config:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/probes/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 20

  cdn:
    # Sirve archivos estáticos con soporte de Range (necesario para PMTiles). Lote C.
    image: nginx:1.29-alpine
    volumes:
      - ./cdn/publico:/usr/share/nginx/html:ro
      - ./cdn/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"

volumes:
  pg_datos:
