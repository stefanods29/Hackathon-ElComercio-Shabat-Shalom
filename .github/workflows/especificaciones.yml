name: Especificaciones

on:
  push:
    branches: [main]
    paths: ['openspec/**', 'contracts/**', 'redocly.yaml', '.github/workflows/especificaciones.yml']
  pull_request:
    paths: ['openspec/**', 'contracts/**', 'redocly.yaml', '.github/workflows/especificaciones.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: OpenSpec (estricto) y contrato OpenAPI
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Validar specs y changes de OpenSpec
        run: npx --yes @fission-ai/openspec@1.16.1 validate --all --strict --no-interactive
      - name: Validar el contrato OpenAPI
        run: npx --yes @redocly/cli@2.76.0 lint contracts/openapi.yaml
