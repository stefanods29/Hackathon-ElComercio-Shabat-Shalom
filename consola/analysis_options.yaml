# Reglas de análisis de la app. `flutter analyze` falla con cualquier aviso: se corrige, no se ignora.
include: package:flutter_lints/flutter.yaml

# Mismo ancho que el backend (Prettier): `dart format lib test` lo aplica.
formatter:
  page_width: 100

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_await_in_return
    - use_named_constants
