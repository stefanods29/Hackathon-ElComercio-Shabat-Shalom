name: vecinal_consola
description: Consola web de operación de Vecinal (Fase 2 · Lote C) para coordinación, brigadas, moderación y curaduría.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

# Proyecto aparte de `app/` (ADR 0014): no trae los plugins móviles de la app (PowerSync, cifrado,
# cámara). Mismas versiones que la app para lo que comparten.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  dio: ^5.11.1
  uuid: ^4.6.0
  maplibre_gl: ^0.28.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
