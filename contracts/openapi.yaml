components:
  securitySchemes:
    tokenDeAcceso:
      type: http
      scheme: bearer
      bearerFormat: JWT ES256 (audiencia vecinal-api, 15 minutos)

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUIDv7 generado en el celular, uno por acción; todos los reintentos usan el mismo.
      schema: { type: string, minLength: 8, maxLength: 255 }

  headers:
    RequestId:
      description: Identificador de la solicitud, también presente en errores y logs JSON.
      schema: { type: string }
    IdempotentReplayed:
      description: '`true` cuando la respuesta es la guardada de un intento anterior.'
      schema: { type: string, enum: ['true'] }

  responses:
    SolicitudInvalida:
      description: Datos inválidos o falta Idempotency-Key (`codigo` = validacion).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeValidacion' }
    NoAutenticado:
      description: Falta el token, venció (`no_autenticado`) o la sesión fue revocada (`sesion_revocada`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    DemasiadasSolicitudes:
      description: Se superó un límite de solicitudes (`codigo` = demasiados_intentos).
      headers:
        Retry-After:
          description: Segundos que deben transcurrir antes de reintentar.
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - type: object
                required: [reintentarEnSegundos]
                properties:
                  reintentarEnSegundos:
                    type: integer
                    minimum: 1
                    description: Segundos que deben transcurrir antes de reintentar.
    Prohibido:
      description: |
        El vecino no puede hacer esto. `nivel_de_confianza_insuficiente` incluye `nivelActual` y
        `nivelRequerido`; `rol_requerido` incluye `rolesRequeridos`. Otros códigos posibles son
        `fuera_de_tu_zona`, `no_eres_el_autor`, `no_eres_el_dueno`, `sin_zona` y `cuenta_suspendida`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: El recurso no existe (`codigo` = recurso_no_encontrado).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflicto:
      description: |
        El estado actual lo impide: favor_no_disponible, conflicto_de_version, id_en_uso o
        solicitud_en_curso (este último trae `Retry-After` y sí se reintenta).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoProcesable:
      description: Regla de negocio incumplida o Idempotency-Key reutilizada con otro contenido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:
    MetricasOperativas:
      type: object
      required: [instanciaId, desde, generadoEn, idempotencia, outbox, colasMotor, colas]
      properties:
        instanciaId: { type: string, format: uuid }
        desde: { type: string, format: date-time }
        generadoEn: { type: string, format: date-time }
        idempotencia:
          type: object
          required: [nueva, repetida, enCurso, huellaDistinta]
          properties:
            nueva: { type: integer, minimum: 0 }
            repetida: { type: integer, minimum: 0 }
            enCurso: { type: integer, minimum: 0 }
            huellaDistinta: { type: integer, minimum: 0 }
        outbox:
          type: object
          required: [pendientes, edadMasAntiguoSegundos]
          properties:
            pendientes: { type: integer, minimum: 0 }
            edadMasAntiguoSegundos: { type: [number, 'null'], minimum: 0 }
        colasMotor: { type: string, enum: [pgboss, memory], description: memory solo existe en pruebas. }
        colas:
          type: array
          items:
            type: object
            required: [nombre, pendientes, activas, fallidas, criticasPendientes, edadCriticaMasAntiguaSegundos]
            properties:
              nombre: { type: string }
              pendientes: { type: integer, minimum: 0, description: Incluye trabajos diferidos y en reintento; excluye activos. }
              activas: { type: integer, minimum: 0 }
              fallidas: { type: integer, minimum: 0 }
              criticasPendientes: { type: integer, minimum: 0 }
              edadCriticaMasAntiguaSegundos:
                type: [number, 'null']
                minimum: 0
                description: Edad del trabajo crítico elegible más antiguo; nulo si no hay ninguno listo.
    TokenDeDispositivo:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: '^[!-~]+$'
      writeOnly: true
    Problema:
      type: object
      description: Problem Details (RFC 9457) con un código estable para el celular.
      required: [type, title, status, codigo]
      properties:
        type: { type: string, examples: ['/problemas/favor-no-disponible'] }
        title: { type: string, examples: ['Conflicto'] }
        status: { type: integer, examples: [409] }
        detail: { type: string, examples: ['Otro vecino ya tomó este favor o ya no está disponible.'] }
        instance: { type: string, examples: ['/v1/publicaciones#requestId=01970000-0000-7000-8000-000000000001'] }
        requestId: { type: string, description: 'Identificador de esta solicitud, incluso al repetir un rechazo guardado.' }
        codigo: { type: string, examples: ['favor_no_disponible'] }
        nivelActual:
          type: integer
          minimum: 0
          maximum: 3
          description: Nivel del vecino cuando el código es `nivel_de_confianza_insuficiente`.
        nivelRequerido:
          type: integer
          minimum: 0
          maximum: 3
          description: Nivel mínimo exigido cuando el código es `nivel_de_confianza_insuficiente`.
        disponibleDesde:
          type: string
          format: date-time
          description: Próxima fecha de cambio para `cambio_de_zona_muy_pronto`.
        versionVigente:
          type: integer
          minimum: 1
          description: Versión del texto para `version_de_consentimiento_desactualizada`.
        rolesRequeridos:
          type: array
          items:
            type: string
            enum: [proveedor, moderador, coordinador, brigadista, curador, administrador]
          description: Roles aceptados cuando el código es `rol_requerido`; basta tener uno.
      additionalProperties: true

    ProblemaDeValidacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          required: [errores]
          properties:
            errores:
              type: array
              items:
                type: object
                required: [campo, mensaje]
                properties:
                  campo: { type: string, examples: ['titulo'] }
                  mensaje: { type: string }

    Salud:
      type: object
      required: [estado, baseDeDatos, hora]
      properties:
        estado: { type: string, enum: [ok, degradado] }
        baseDeDatos: { type: string, enum: [ok, caida] }
        hora: { type: string, format: date-time }

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, y, kid, alg, use]
            properties:
              kty: { type: string, const: EC }
              crv: { type: string, const: P-256 }
              x: { type: string }
              y: { type: string }
              kid: { type: string }
              alg: { type: string, const: ES256 }
              use: { type: string, const: sig }

    SolicitudSesionDev:
      type: object
      required: [telefono]
      properties:
        telefono: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', examples: ['+51900000002'] }

    SolicitudOtp:
      type: object
      required: [telefono]
      properties:
        telefono:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          examples: ['+51987654321']
        canal:
          type: string
          enum: [sms, whatsapp]
          default: sms

    OtpEnviado:
      type: object
      required: [reintentarEnSegundos, expiraEnSegundos]
      properties:
        reintentarEnSegundos: { type: integer, minimum: 1, examples: [60] }
        expiraEnSegundos: { type: integer, minimum: 1, examples: [300] }

    IngresoConFirebase:
      type: object
      required: [tokenFirebase]
      properties:
        tokenFirebase: { type: string, minLength: 1, maxLength: 4096, description: ID token que Firebase entrega a la app tras verificar el SMS. }
        dispositivo: { type: string, maxLength: 80 }
    VerificacionOtp:
      type: object
      required: [telefono, codigo]
      properties:
        telefono:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          examples: ['+51987654321']
        codigo: { type: string, pattern: '^[0-9]{6}$', examples: ['123456'] }
        dispositivo: { type: string, maxLength: 80 }

    Zona:
      type: object
      required: [id, nombre, distrito]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        distrito: { type: string }

    EleccionZona:
      type: object
      required: [zonaId]
      properties:
        zonaId: { type: string, format: uuid }

    PresenciaDeResidencia:
      type: object
      additionalProperties: false
      required: [fecha, dentroDeLaZona]
      properties:
        fecha: { type: string, format: date, description: Día calendario en America/Lima. }
        dentroDeLaZona: { type: boolean }

    ConfirmacionDeResidencia:
      type: object
      additionalProperties: false
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 1, maxLength: 500 }
        nivel: { type: integer, enum: [1, 2], default: 1 }

    NivelDeResidencia:
      type: object
      required: [nivel]
      properties:
        nivel: { type: integer, minimum: 0, maximum: 3 }

    FinalidadDeConsentimiento:
      type: string
      enum: [uso_del_servicio, confirmacion_por_presencia]

    DecisionDeConsentimiento:
      type: object
      additionalProperties: false
      required: [finalidad, version, aceptado]
      properties:
        finalidad: { $ref: '#/components/schemas/FinalidadDeConsentimiento' }
        version: { type: integer, minimum: 1, maximum: 2147483647 }
        aceptado: { type: boolean }

    EstadoDeConsentimiento:
      type: object
      required: [finalidad, versionVigente, obligatoria, decision]
      properties:
        finalidad: { $ref: '#/components/schemas/FinalidadDeConsentimiento' }
        versionVigente: { type: integer, minimum: 1 }
        obligatoria: { type: boolean }
        decision:
          type: [object, 'null']
          required: [version, aceptado, decididoEn]
          properties:
            version: { type: integer, minimum: 1 }
            aceptado: { type: boolean }
            decididoEn: { type: string, format: date-time }

    RectificacionDePerfil:
      type: object
      additionalProperties: false
      required: [nombreVisible]
      properties:
        nombreVisible: { type: string, minLength: 2, maxLength: 60 }

    ExportacionDeDatosPersonales:
      type: object
      required: [generadoEn, modulos]
      properties:
        generadoEn: { type: string, format: date-time }
        modulos:
          type: object
          description: Cada módulo aporta sus propios registros del vecino, sin credenciales ni datos de terceros.
          additionalProperties:
            type: object

    Sesion:
      type: object
      required: [tokenDeAcceso, expiraEn, usuario]
      properties:
        tokenDeAcceso: { type: string }
        expiraEn: { type: string, format: date-time }
        refreshToken: { type: string, description: Token opaco; solo presente al verificar OTP o renovar. }
        refreshExpiraEn: { type: string, format: date-time }
        usuario:
          type: object
          required: [id, nombreVisible, zonaId, nivel, roles]
          properties:
            id: { type: string, format: uuid }
            nombreVisible: { type: string }
            zonaId: { type: [string, 'null'], format: uuid }
            nivel: { type: integer, minimum: 0, maximum: 3 }
            roles:
              type: array
              items: { type: string, enum: [proveedor, moderador, coordinador, brigadista, curador, administrador] }

    SesionRenovable:
      allOf:
        - $ref: '#/components/schemas/Sesion'
        - type: object
          required: [refreshToken, refreshExpiraEn]

    RenovacionSesion:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 512 }

    CredencialesSincronizacion:
      type: object
      required: [endpoint, token, expiraEn]
      properties:
        endpoint: { type: string, format: uri, description: URL del servicio de PowerSync. }
        token: { type: string, description: 'JWT ES256, audiencia powersync, claims sub y zona.' }
        expiraEn: { type: string, format: date-time }

    TipoDeContenidoModerado:
      type: string
      enum: [publicacion, resena, servicio, foto, proveedor]

    MotivoDeDenuncia:
      type: string
      enum: [spam, ofensivo, informacion_falsa, datos_personales, peligroso, otro]

    NuevaDenuncia:
      type: object
      additionalProperties: false
      required: [id, tipoContenido, contenidoId, motivo]
      properties:
        id: { type: string, format: uuid, description: UUIDv7 generado por el celular. }
        tipoContenido: { $ref: '#/components/schemas/TipoDeContenidoModerado' }
        contenidoId: { type: string, format: uuid }
        motivo: { $ref: '#/components/schemas/MotivoDeDenuncia' }
        detalle: { type: string, maxLength: 500 }

    DenunciaPropia:
      type: object
      required: [id, casoId, tipoContenido, contenidoId, motivo, creadaEn]
      properties:
        id: { type: string, format: uuid }
        casoId: { type: string, format: uuid }
        tipoContenido: { $ref: '#/components/schemas/TipoDeContenidoModerado' }
        contenidoId: { type: string, format: uuid }
        motivo: { $ref: '#/components/schemas/MotivoDeDenuncia' }
        creadaEn: { type: string, format: date-time }

    EstadoDeCaso:
      type: string
      enum: [pendiente, resuelto]

    AccionDeModeracion:
      type: string
      enum: [publicar, ocultar, restaurar, descartar, sancionar]

    DecisionDeModeracion:
      type: object
      additionalProperties: false
      required: [accion, motivo]
      properties:
        accion: { $ref: '#/components/schemas/AccionDeModeracion' }
        motivo: { type: string, minLength: 1, maxLength: 500 }

    CasoDeModeracion:
      type: object
      required: [id, tipoContenido, contenidoId, estado, motivo, ultimaAccion, creadoEn, actualizadoEn, primeraRevisionEn]
      properties:
        id: { type: string, format: uuid }
        tipoContenido: { $ref: '#/components/schemas/TipoDeContenidoModerado' }
        contenidoId: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/EstadoDeCaso' }
        motivo: { type: string, description: Código del motivo en la cola, sin texto libre ni datos de contacto. }
        ultimaAccion:
          anyOf:
            - $ref: '#/components/schemas/AccionDeModeracion'
            - type: 'null'
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        primeraRevisionEn: { type: [string, 'null'], format: date-time }

    PaginaDeCasos:
      type: object
      required: [datos, siguienteCursor]
      properties:
        datos:
          type: array
          items: { $ref: '#/components/schemas/CasoDeModeracion' }
        siguienteCursor: { type: [string, 'null'] }

    MetricasDeModeracion:
      type: object
      required: [desde, hasta, totalCasos, pendientes, p90PrimeraRevisionSegundos]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }
        totalCasos: { type: integer, minimum: 0 }
        pendientes: { type: integer, minimum: 0 }
        p90PrimeraRevisionSegundos:
          type: [integer, 'null']
          minimum: 0
          description: Percentil redondeado hacia arriba, o nulo si no hubo revisiones humanas.

    NuevaResena:
      type: object
      additionalProperties: false
      required: [id, servicioId, calificacion]
      properties:
        id:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          description: UUIDv7 generado en el celular.
        servicioId: { type: string, format: uuid }
        calificacion: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: [string, 'null'], maxLength: 2000 }
        fotos:
          type: array
          maxItems: 3
          uniqueItems: true
          default: []
          items: { type: string, format: uuid, description: Id de un archivo listo del autor. }

    ResenaPropia:
      type: object
      required: [id, servicioId, calificacion, comentario, fotos, estado, motivoEstado, creadoEn, actualizadoEn, publicadaEn]
      properties:
        id: { type: string, format: uuid }
        servicioId: { type: string, format: uuid }
        calificacion: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: [string, 'null'], maxLength: 2000 }
        fotos:
          type: array
          maxItems: 3
          items: { type: string, format: uuid }
          description: Referencias propias; el estado de la reseña determina si las variantes son públicas.
        estado: { type: string, enum: [en_revision, publicada, oculta] }
        motivoEstado: { type: [string, 'null'] }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        publicadaEn: { type: [string, 'null'], format: date-time }

    VistoBuenoPropio:
      type: object
      required: [id, servicioId, creadoEn, cuentaParaRanking]
      properties:
        id: { type: string, format: uuid, description: UUIDv7 asignado por el servidor. }
        servicioId: { type: string, format: uuid }
        creadoEn: { type: string, format: date-time }
        cuentaParaRanking: { type: boolean, description: Se otorgó con nivel 2 o superior. }

    Categoria:
      type: object
      required: [id, nombre, icono, utilEnEmergencia, orden]
      properties:
        id: { type: string, pattern: '^[a-z0-9-]{2,40}$', examples: [gasfiteria] }
        nombre: { type: string }
        icono: { type: string, description: Nombre de un ícono de Material. }
        utilEnEmergencia: { type: boolean }
        orden: { type: integer }

    GuardarProveedor:
      type: object
      additionalProperties: false
      required: [nombrePublico]
      properties:
        nombrePublico: { type: string, minLength: 2, maxLength: 60 }
        descripcion: { type: [string, 'null'], maxLength: 500 }

    Proveedor:
      type: object
      required: [id, nombrePublico, descripcion, actualizadoEn]
      properties:
        id: { type: string, format: uuid }
        nombrePublico: { type: string }
        descripcion: { type: [string, 'null'] }
        actualizadoEn: { type: string, format: date-time }

    PerfilDeProveedor:
      allOf:
        - $ref: '#/components/schemas/Proveedor'
        - type: object
          required: [servicios]
          properties:
            servicios:
              type: array
              items: { $ref: '#/components/schemas/Servicio' }

    UbicacionDeServicio:
      type: object
      additionalProperties: false
      required: [lat, lng]
      description: |
        En la entrada es la ubicación exacta privada para buscar por radio.
        En las respuestas es solo la copia pública, redondeada a 3 decimales salvo
        aceptación explícita de muestraUbicacionExacta para un local a la calle.
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    DatosDeServicio:
      type: object
      required: [categoriaId, titulo, ubicacion]
      properties:
        categoriaId: { type: string, pattern: '^[a-z0-9-]{2,40}$' }
        titulo: { type: string, minLength: 3, maxLength: 120 }
        descripcion: { type: [string, 'null'], maxLength: 2000 }
        ubicacion: { $ref: '#/components/schemas/UbicacionDeServicio' }
        muestraUbicacionExacta:
          type: boolean
          default: false
          description: Aceptación explícita para publicar la posición exacta del local; desactivada por defecto.
        radioCoberturaM: { type: integer, minimum: 100, maximum: 20000, default: 2000 }
        disponibleEnEmergencia: { type: boolean, default: false }
        atributos:
          type: object
          additionalProperties: true
          default: {}
          description: Objeto JSON de hasta 4096 bytes serializado en UTF-8.

    NuevoServicio:
      allOf:
        - $ref: '#/components/schemas/DatosDeServicio'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
              description: UUIDv7 generado en el celular.
      unevaluatedProperties: false

    EditarServicio:
      allOf:
        - $ref: '#/components/schemas/DatosDeServicio'
        - type: object
          required: [versionVista]
          properties:
            versionVista: { type: integer, minimum: 1 }
      unevaluatedProperties: false

    ServicioCercano:
      allOf:
        - $ref: '#/components/schemas/Servicio'
        - type: object
          required: [distanciaMetros]
          properties:
            distanciaMetros:
              type: integer
              minimum: 0
              maximum: 20000
              multipleOf: 50

    PaginaDeServicios:
      type: object
      required: [datos, siguienteCursor]
      properties:
        datos:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ServicioCercano' }
        siguienteCursor: { type: [string, 'null'], maxLength: 512 }

    Servicio:
      type: object
      required:
        [id, proveedorId, zonaId, categoriaId, titulo, descripcion, ubicacion, radioCoberturaM,
         disponibleEnEmergencia, atributos, totalResenas, promedio, puntajeRanking,
         vistosBuenosDeLaZona, version, creadoEn, actualizadoEn, eliminadoEn]
      properties:
        id: { type: string, format: uuid }
        proveedorId: { type: string, format: uuid }
        zonaId: { type: string, format: uuid }
        categoriaId: { type: string }
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }
        ubicacion: { $ref: '#/components/schemas/UbicacionDeServicio' }
        radioCoberturaM: { type: integer, minimum: 100, maximum: 20000 }
        disponibleEnEmergencia: { type: boolean }
        atributos: { type: object, additionalProperties: true }
        totalResenas: { type: integer, minimum: 0 }
        promedio: { type: number, minimum: 0, maximum: 5 }
        puntajeRanking: { type: number, minimum: 0, maximum: 5 }
        vistosBuenosDeLaZona: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        eliminadoEn: { type: [string, 'null'], format: date-time }

    TipoPublicacion:
      type: string
      enum: [ofrezco, necesito, presto, dono, intercambio, movilidad]

    Coordenadas:
      type: object
      description: Se guardan redondeadas a ~100 m; nunca la ubicación exacta de una persona.
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    NuevaPublicacion:
      type: object
      required: [id, tipo, categoria, titulo]
      properties:
        id: { type: string, format: uuid, description: UUIDv7 generado en el celular. }
        tipo: { $ref: '#/components/schemas/TipoPublicacion' }
        categoria: { type: string, minLength: 2, maxLength: 40, examples: [herramientas] }
        titulo: { type: string, minLength: 3, maxLength: 120 }
        descripcion: { type: [string, 'null'], maxLength: 2000 }
        ubicacion:
          oneOf:
            - $ref: '#/components/schemas/Coordenadas'
            - type: 'null'
        venceEn: { type: [string, 'null'], format: date-time }

    TomarFavor:
      type: object
      required: [versionVista]
      properties:
        versionVista:
          type: integer
          minimum: 1
          description: Versión de la publicación que el vecino veía cuando tocó "Tomar".

    CambioDeEstadoPublicacion:
      type: object
      required: [versionVista]
      properties:
        versionVista: { type: integer, minimum: 1 }

    PublicacionCercana:
      allOf:
        - $ref: '#/components/schemas/Publicacion'
        - type: object
          required: [distanciaMetros]
          properties:
            distanciaMetros: { type: integer, minimum: 0, multipleOf: 50 }

    PaginaDePublicaciones:
      type: object
      required: [datos, siguienteCursor]
      properties:
        datos:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PublicacionCercana' }
        siguienteCursor: { type: [string, 'null'] }

    Publicacion:
      type: object
      required:
        [id, autorId, zonaId, tipo, categoria, titulo, descripcion, ubicacion, estado,
         tomadaPorId, version, venceEn, creadoEn, actualizadoEn]
      properties:
        id: { type: string, format: uuid }
        autorId: { type: string, format: uuid }
        zonaId: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoPublicacion' }
        categoria: { type: string }
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }
        ubicacion:
          oneOf:
            - $ref: '#/components/schemas/Coordenadas'
            - type: 'null'
        estado: { type: string, enum: [abierta, en_curso, resuelta, cancelada] }
        tomadaPorId: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 1 }
        venceEn: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
