openapi: 3.1.1
info:
  title: API de la app vecinal
  version: 0.1.0
  summary: Contrato de la Fase 0 (cimientos). Fuente de verdad para backend y app.
  description: |
    Contrato **primero el contrato, después el código**: cualquier cambio de la API se hace
    aquí en el mismo PR que lo implementa, y CI lo valida.

    Reglas que toda ruta cumple (sección 4.5 de la arquitectura):
    - `x-request-id` correlaciona respuesta y logs; cada problema incluye `requestId` y lo
      referencia en `instance`. Un problema repetido conserva su rechazo con una correlación nueva.
    - Errores en formato **Problem Details (RFC 9457)** con un `codigo` estable.
    - Toda escritura que el celular envía desde su cola offline exige `Idempotency-Key`.
      Un reintento con la misma clave y el mismo cuerpo devuelve la respuesta guardada
      (200 con `Idempotent-Replayed: true` si fue un éxito, o el mismo rechazo).
    - Cómo decide el celular: 2xx → *enviado*; 4xx salvo 408/429 → *no se pudo completar*
      (rechazo definitivo, va a "acciones por revisar"); red caída, 408, 429 y 5xx → se
      reintenta con espera exponencial y variación aleatoria.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000
    description: Desarrollo local (infra/docker-compose.yml + npm run start:dev)
tags:
  - name: plataforma
    description: Salud y claves públicas.
  - name: identidad
    description: Sesión y credenciales de sincronización.
  - name: directorio
    description: Categorías, perfiles de proveedor y servicios vecinales.
  - name: reputacion
    description: Reseñas y Visto Bueno vecinal.
  - name: moderacion
    description: Denuncias, cola de revisión y decisiones.
  - name: solidaridad
    description: Muro de favores.
  - name: operacion
    description: Métricas, turnos, habilitaciones y auditoría según el rol operativo.
  - name: emergencias
    description: Eventos, cobertura, pedidos de ayuda y recursos con acceso minimizado.
  - name: notificaciones
    description: Registro y baja de dispositivos para avisos personales.
security:
  - tokenDeAcceso: []

paths:
  /v1/salud:
    get:
      tags: [plataforma]
      operationId: revisarSalud
      summary: Estado de la API y de la base de datos
      security: []
      responses:
        '200':
          description: Todo funciona.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
        '503':
          description: La base de datos no responde.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }

  /.well-known/jwks.json:
    get:
      tags: [plataforma]
      operationId: obtenerJwks
      summary: Claves públicas (JWKS) para validar los JWT ES256
      description: La consulta PowerSync (`client_auth.jwks_uri`) para validar los tokens de sincronización.
      security: []
      responses:
        '200':
          description: Conjunto de claves públicas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }

  /v1/dev/sesiones:
    post:
      tags: [identidad]
      operationId: iniciarSesionDeDesarrollo
      summary: 'SOLO DESARROLLO: inicia sesión con el teléfono de un vecino sembrado'
      description: |
        Responde 404 cuando `ENABLE_DEV_SESSION` está apagado (siempre en producción).
        La reemplaza el inicio de sesión con OTP del Lote B.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudSesionDev' }
      responses:
        '201':
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/sync/credenciales:
    get:
      tags: [identidad]
      operationId: obtenerCredencialesDeSincronizacion
      summary: Token para conectarse a PowerSync
      description: |
        Lo llama `fetchCredentials()` del conector de PowerSync. El token (audiencia `powersync`)
        lleva `sub` (vecino) y `zona`, que usan los Sync Streams; zona y nivel se releen de la
        base en cada emisión. Una familia de sesión revocada o vencida recibe 401
        (`codigo` = sesion_revocada), aunque su token de acceso aún no haya vencido.
      responses:
        '200':
          description: Credenciales vigentes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredencialesSincronizacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /v1/auth/otp:
    post:
      tags: [identidad]
      operationId: solicitarCodigo
      summary: Solicitar un código de un solo uso
      description: |
        Responde igual exista o no la cuenta para no revelar qué teléfonos están registrados.
        Un teléfono o una IP bloqueados por verificaciones fallidas reciben 429 hasta que termine
        el bloqueo, aunque el código anterior haya caducado.
        Esta ruta es en línea y no usa Idempotency-Key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudOtp' }
      responses:
        '202':
          description: Código aceptado para su envío.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpEnviado' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '409':
          description: Este servidor verifica el teléfono con Firebase desde la app (`codigo` = metodo_no_disponible).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '503':
          description: El proveedor de mensajes no está disponible (`codigo` = servicio_no_disponible).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/auth/otp/verificar:
    post:
      tags: [identidad]
      operationId: verificarCodigo
      summary: Verificar un código e iniciar sesión
      description: |
        Devuelve acceso con claim `sid` (familia de sesión), refresh token opaco y usuario.
        Un código incorrecto, vencido o ya utilizado recibe la misma respuesta 401.
        Los fallos se acumulan por teléfono y por IP entre códigos distintos. Por defecto, cinco
        fallos por teléfono o veinte por IP en quince minutos bloquean durante quince minutos
        desde el fallo que alcanza el límite; los siguientes intentos reciben 429 y Retry-After.
        Esta ruta es en línea y no usa Idempotency-Key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificacionOtp' }
      responses:
        '200':
          description: Código verificado y sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionRenovable' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401':
          description: Código incorrecto, vencido o ya utilizado (`codigo` = codigo_invalido).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: Este servidor verifica el teléfono con Firebase desde la app (`codigo` = metodo_no_disponible).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }

  /v1/auth/firebase:
    post:
      tags: [identidad]
      operationId: ingresarConFirebase
      summary: Iniciar sesión con un teléfono verificado por Firebase
      description: |
        Firebase Authentication envía el SMS y verifica el código en la app. La app manda aquí el
        ID token de ese ingreso y la API, después de validarlo con las claves públicas de Google,
        abre la misma sesión que `POST /v1/auth/otp/verificar`. Solo acepta ingresos por teléfono
        de hace diez minutos o menos. Requiere `FIREBASE_PROJECT_ID` en el servidor.
        Esta ruta es en línea y no usa Idempotency-Key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngresoConFirebase' }
      responses:
        '200':
          description: Teléfono confirmado y sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionRenovable' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401':
          description: Token inválido, vencido, de otro proyecto o que no es de un teléfono (`codigo` = token_firebase_invalido).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409':
          description: Este servidor no tiene habilitado el ingreso con Firebase (`codigo` = metodo_no_disponible).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503':
          description: No se pudieron consultar las claves públicas de Google (`codigo` = servicio_no_disponible).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/auth/refrescar:
    post:
      tags: [identidad]
      operationId: refrescarSesion
      summary: Renovar el par de tokens y consumir el refresh anterior
      description: |
        Cada refresh token se usa una sola vez. Reutilizar uno ya rotado revoca toda su familia
        y responde 401 sesion_revocada. No hay ventana de gracia: el cliente debe serializar
        las renovaciones y guardar el refresh nuevo antes de usarlo. Si pierde la respuesta,
        debe iniciar sesión otra vez. Ruta en línea, sin Idempotency-Key ni reintento automático.
        Zona, nivel y roles se releen de la base al emitir el par nuevo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenovacionSesion' }
      responses:
        '200':
          description: Par de tokens nuevo; el refresh presentado queda consumido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionRenovable' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401':
          description: Refresh desconocido o vencido (sesion_invalida), revocado o reutilizado (sesion_revocada).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/auth/cerrar-sesion:
    post:
      tags: [identidad]
      operationId: cerrarSesion
      summary: Revocar la familia de sesión del dispositivo actual
      description: |
        Impide renovar tokens y obtener credenciales nuevas de PowerSync. El acceso ya emitido
        conserva su vigencia hasta expirar; las credenciales de PowerSync ya emitidas también.
        Operación en línea e idempotente. Una sesión de desarrollo sin sid no tiene familia.
      responses:
        '204': { description: Familia revocada o ya cerrada. }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /v1/auth/sesiones/revocar:
    post:
      tags: [identidad]
      operationId: revocarTodasLasSesiones
      summary: Revocar todas las familias de sesión del vecino
      description: |
        Incluye el dispositivo actual. Impide renovar tokens y obtener credenciales nuevas
        de PowerSync en todos los dispositivos. Los tokens ya emitidos conservan su vigencia
        hasta expirar. Operación en línea e idempotente.
      responses:
        '204': { description: Todas las familias revocadas. }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /v1/zonas:
    get:
      tags: [identidad]
      operationId: listarZonas
      summary: Listar las zonas disponibles
      description: La lista pública no incluye los polígonos de las zonas.
      security: []
      responses:
        '200':
          description: Zonas disponibles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Zona' }

  /v1/yo/zona:
    put:
      tags: [identidad]
      operationId: elegirZona
      summary: Elegir o cambiar la zona del vecino
      description: |
        Devuelve una sesión con un token de acceso que ya incluye la zona elegida.
        Conserva su familia `sid`; una familia revocada o vencida recibe 401 sesion_revocada.
        Elegir la misma zona conserva el nivel. Cambiar a otra vuelve al nivel 0 y solo se
        permite cada 30 días. No rota el refresh token.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EleccionZona' }
      responses:
        '200':
          description: Zona elegida y token actualizado.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: '`cambio_de_zona_muy_pronto` con `disponibleDesde`, o conflicto de idempotencia.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/yo/residencia/presencia:
    post:
      tags: [identidad]
      operationId: informarPresencia
      summary: Informar si el vecino estuvo dentro de su zona en un día
      description: Registra una respuesta por fecha local con consentimiento vigente; no recibe coordenadas.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresenciaDeResidencia' }
      responses:
        '200':
          description: Nivel de confianza después de procesar el informe.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NivelDeResidencia' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: '`consentimiento_requerido` o `zona_requerida`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422':
          description: '`fecha_de_presencia_invalida` o clave de idempotencia reutilizada con otro contenido.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/vecinos/{id}/residencia:
    post:
      tags: [identidad]
      operationId: confirmarResidencia
      summary: Confirmar la residencia de un vecino como moderador
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmacionDeResidencia' }
      responses:
        '200':
          description: Nivel de confianza después de la confirmación.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NivelDeResidencia' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/vecinos/{id}/aval:
    post:
      tags: [identidad]
      operationId: avalarResidencia
      summary: Avalar a otro vecino de la misma zona desde el nivel 2
      description: Cada vecino cuenta una vez por residencia; dos avales distintos elevan al vecino confirmado al nivel 2.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Nivel de confianza del vecino avalado.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NivelDeResidencia' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: '`no_puedes_avalarte`, `fuera_de_tu_zona` o `nivel_de_confianza_insuficiente`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/yo/consentimientos:
    get:
      tags: [identidad]
      operationId: listarConsentimientos
      summary: Consultar las finalidades, las versiones vigentes y las últimas decisiones
      responses:
        '200':
          description: Finalidades y decisiones del vecino.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstadoDeConsentimiento' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [identidad]
      operationId: registrarConsentimiento
      summary: Aceptar o rechazar una finalidad con su versión vigente
      description: Rechazar la presencia impide nuevos informes y conserva el nivel ya confirmado.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionDeConsentimiento' }
      responses:
        '200':
          description: Decisión registrada.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoDeConsentimiento' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409':
          description: '`version_de_consentimiento_desactualizada` o conflicto de idempotencia.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/yo/datos:
    get:
      tags: [identidad]
      operationId: exportarDatosPersonales
      summary: Exportar los datos del vecino que hizo la solicitud
      responses:
        '200':
          description: Datos personales agrupados por módulo. No se almacena en caché.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportacionDeDatosPersonales' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /v1/yo:
    patch:
      tags: [identidad]
      operationId: rectificarMiPerfil
      summary: Rectificar el nombre visible del vecino
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RectificacionDePerfil' }
      responses:
        '200':
          description: Nombre visible actualizado.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RectificacionDePerfil' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }
    delete:
      tags: [identidad]
      operationId: cancelarMiCuenta
      summary: Revocar todas las sesiones y programar la eliminación de la cuenta
      description: Tras aceptar la solicitud, las credenciales de la cuenta dejan de servir en la API. Las siguientes solicitudes con esas credenciales reciben 401.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancelación aceptada; la eliminación de los datos se completa en segundo plano.
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/denuncias:
    post:
      tags: [moderacion]
      operationId: denunciarContenido
      summary: Denunciar contenido para revisión humana
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaDenuncia' }
      responses:
        '201':
          description: Denuncia registrada y caso pendiente de revisión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DenunciaPropia' }
        '200':
          description: La misma denuncia ya estaba registrada.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DenunciaPropia' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/moderacion/casos:
    get:
      tags: [moderacion]
      operationId: listarCasosDeModeracion
      summary: Listar casos como moderador sin exponer datos de contacto
      parameters:
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/EstadoDeCaso' }
          description: Si se omite, muestra solo los casos pendientes.
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
          description: Cursor opaco de la página anterior, para el mismo estado.
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Casos ordenados de más antiguos a más recientes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeCasos' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /v1/moderacion/casos/{id}/decision:
    post:
      tags: [moderacion]
      operationId: decidirCasoDeModeracion
      summary: Registrar una decisión auditada como moderador
      description: Publicar, ocultar o restaurar el contenido se aplica mediante un trabajo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionDeModeracion' }
      responses:
        '200':
          description: Decisión registrada y caso resuelto.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasoDeModeracion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/moderacion/metricas:
    get:
      tags: [moderacion]
      operationId: consultarMetricasDeModeracion
      summary: Consultar el tiempo hasta la primera revisión humana como administrador
      description: Selecciona por fecha de creación del caso. Por defecto abarca los últimos siete días.
      parameters:
        - name: desde
          in: query
          schema: { type: string, format: date-time }
          description: Inicio inclusivo.
        - name: hasta
          in: query
          schema: { type: string, format: date-time }
          description: Fin exclusivo.
      responses:
        '200':
          description: Totales del periodo y percentil 90 de los casos con primera revisión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricasDeModeracion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /v1/operacion/metricas:
    get:
      tags: [operacion]
      operationId: consultarMetricasOperativas
      summary: Métricas de idempotencia, outbox y colas para administradores
      description: |
        Exige el rol administrador. Los contadores de idempotencia corresponden a esta
        instancia desde su arranque; outbox y colas son lecturas actuales de PostgreSQL.
        No devuelve cargas de trabajos, cuerpos, claves de idempotencia ni tokens.
        Todas las rutas aceptan x-request-id de 1–128 caracteres ASCII seguros; si falta
        o es inválido se genera un UUIDv7. La respuesta lo devuelve y los problemas incluyen
        requestId y un instance que lo identifica. Los reintentos tienen su propio requestId.
      parameters:
        - name: x-request-id
          in: header
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      responses:
        '200':
          description: Instantánea operativa sin datos personales ni cargas de trabajos.
          headers:
            x-request-id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricasOperativas' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /v1/categorias:
    get:
      tags: [directorio]
      operationId: listarCategorias
      summary: Categorías del directorio con sesión
      responses:
        '200':
          description: Categorías ordenadas por orden e id.
          content:
            application/json:
              schema:
                type: object
                required: [datos]
                properties:
                  datos:
                    type: array
                    items: { $ref: '#/components/schemas/Categoria' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /v1/yo/proveedor:
    put:
      tags: [directorio]
      operationId: guardarMiPerfilDeProveedor
      summary: Crear o actualizar mi perfil de proveedor
      description: Exige nivel 1 y zona (403 nivel_de_confianza_insuficiente o sin_zona).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardarProveedor' }
      responses:
        '200':
          description: Perfil guardado; el id es el del vecino.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Proveedor' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/servicios:
    get:
      tags: [directorio]
      operationId: buscarServicios
      summary: Buscar servicios vigentes de mi zona por cercanía y texto
      description: |
        Requiere sesión y zona (403 sin_zona). Excluye servicios y proveedores retirados u ocultos.
        Ordena por vistosBuenosDeLaZona descendente, puntajeRanking descendente e id ascendente.
        El texto busca en título y descripción en español, sin tildes, y tolera errores leves
        en el título con similitud de palabras mayor a 0,3.
        El cursor es opaco y solo contiene los tres valores de orden, nunca coordenadas.
        Debe reutilizarse con los mismos filtros; el orden es estable mientras no cambien los
        agregados de reputación. Un cursor inválido responde 400 validacion.
        Solo devuelve la ubicación pública y distanciaMetros redondeada a múltiplos de 50.
        No guarda el punto de búsqueda ni requiere Idempotency-Key.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radioM
          in: query
          schema: { type: integer, minimum: 100, maximum: 20000, default: 2000 }
        - name: categoriaId
          in: query
          schema: { type: string, pattern: '^[a-z0-9-]{2,40}$' }
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: soloEmergencia
          in: query
          schema: { type: boolean, default: false }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Página de servicios públicos; siguienteCursor es nulo si no hay más.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeServicios' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [directorio]
      operationId: publicarServicio
      summary: Publicar un servicio con el id UUIDv7 del celular
      description: |
        Exige nivel 1, zona y perfil de proveedor vigente (404 si no existe).
        Repetir un id propio devuelve el servicio existente, incluso retirado, sin modificarlo
        ni emitir otro evento. Un id ajeno responde 409 id_en_uso sin revelar su contenido.
        Categoría inexistente responde 422 categoria_invalida.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoServicio' }
      responses:
        '201':
          description: Servicio publicado en versión 1 con su evento en el outbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '200':
          description: El id ya era del mismo proveedor o se repitió la misma Idempotency-Key.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/servicios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [directorio]
      operationId: editarServicio
      summary: Reemplazar los datos de un servicio propio con la versión vista
      description: |
        Solo el dueño (403 no_eres_el_dueno). Una versión vieja responde
        409 conflicto_de_version con versionEsperada y versionActual.
        Un servicio retirado responde 409 servicio_retirado; una categoría inexistente,
        422 categoria_invalida. No modifica los agregados de reputación.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditarServicio' }
      responses:
        '200':
          description: Servicio actualizado y versión incrementada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }
    delete:
      tags: [directorio]
      operationId: retirarServicio
      summary: Retirar un servicio propio con borrado lógico
      description: |
        Solo el dueño (403 no_eres_el_dueno). No requiere cuerpo ni versión.
        Repetir el retiro con una clave nueva sigue respondiendo 204 y no incrementa la versión.
        El interceptor compartido responde 200 al repetir la misma Idempotency-Key,
        como en las demás bajas de la API, con Idempotent-Replayed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Servicio retirado, incluso si ya lo estaba. }
        '200':
          description: Reintento con la misma clave de un retiro ya procesado.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/proveedores/{id}:
    get:
      tags: [directorio]
      operationId: obtenerProveedor
      summary: Perfil público con los servicios vigentes
      description: |
        No incluye teléfono ni ubicación privada. Los servicios retirados u ocultos no aparecen;
        un proveedor retirado u oculto responde 404. Solo viaja la copia pública de la ubicación.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Perfil y servicios públicos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilDeProveedor' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/resenas:
    post:
      tags: [reputacion]
      operationId: escribirResena
      x-nivel-minimo: 1
      summary: Registrar una reseña propia en revisión
      description: |
        Requiere nivel 1, una cuenta con la antigüedad mínima y un servicio vigente de la misma zona.
        El UUIDv7 lo genera el celular. Repetir un id propio devuelve la reseña existente sin sumar
        a la cuota. El registro de la reseña y reputacion.resena_creada se confirman juntos.
        Las fotos deben ser archivos listos del autor para reseñas y se publican con su contenido.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaResena' }
      responses:
        '201':
          description: Reseña creada en estado en_revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResenaPropia' }
        '200':
          description: La reseña propia ya existía o se repitió la misma clave.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResenaPropia' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: nivel_de_confianza_insuficiente, sin_zona, no_puedes_resenarte, fuera_de_tu_zona o cuenta_muy_nueva.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: resena_duplicada, id_en_uso o solicitud_en_curso.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422':
          description: archivo_no_valido o idempotency_key_reutilizada.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '429':
          description: limite_diario_alcanzado en la ventana móvil de 24 horas.
          headers:
            Retry-After:
              description: Segundos hasta que la reseña más antigua salga de la ventana.
              required: true
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - type: object
                    required: [reintentarEnSegundos]
                    properties:
                      reintentarEnSegundos: { type: integer, minimum: 1 }

  /v1/servicios/{id}/visto-bueno:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [reputacion]
      operationId: darVistoBueno
      x-nivel-minimo: 1
      summary: Dar un Visto Bueno al servicio de otro vecino de mi zona
      description: |
        Registra un único Visto Bueno por vecino y servicio; repetirlo conserva el id y el nivel
        con el que se otorgó. Solo cuenta para el ranking desde el nivel 2. No requiere cuerpo.
        Responde 403 sin_zona, fuera_de_tu_zona, no_puedes_resenarte o nivel_de_confianza_insuficiente.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Visto Bueno registrado o ya existente.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VistoBuenoPropio' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }
    delete:
      tags: [reputacion]
      operationId: quitarVistoBueno
      x-nivel-minimo: 1
      summary: Quitar mi Visto Bueno de forma idempotente
      description: Puede retirar su propio Visto Bueno aunque el servicio ya no esté vigente. No requiere cuerpo.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Visto Bueno retirado o ya inexistente. }
        '200':
          description: Repetición con la misma clave de un retiro procesado.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/publicaciones:
    get:
      tags: [solidaridad]
      operationId: buscarPublicacionesCercanas
      summary: Buscar favores abiertos de tu zona por cercanía
      description: |
        Devuelve solo publicaciones abiertas, no eliminadas, con ubicación y sin vencer,
        ordenadas por distancia y luego por id. La distancia se redondea a múltiplos de 50 m;
        las ubicaciones publicadas ya son aproximadas. La posición de búsqueda no se guarda.
        El cursor es opaco y se debe reutilizar con el mismo punto y radio. Es una lectura
        en línea; el cursor no representa una instantánea del muro.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radio
          in: query
          schema: { type: integer, minimum: 100, maximum: 5000, default: 2000 }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Página de favores cercanos, posiblemente vacía.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDePublicaciones' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [solidaridad]
      operationId: publicarEnElMuro
      x-nivel-minimo: 1
      summary: Publicar en el muro de favores (tercer toque)
      description: |
        El `id` lo genera el celular (UUIDv7). Si la publicación ya existía (reintento), responde
        200 con la existente: nunca se duplica. Requiere nivel de confianza mínimo 1 y una zona.
        Sin token responde 401; con un nivel insuficiente responde 403
        `nivel_de_confianza_insuficiente`.
        El límite por autor es una ventana móvil de 24 horas (10 por defecto), incluidas
        publicaciones canceladas o eliminadas. Un reintento del mismo id no consume otra plaza.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaPublicacion' }
      responses:
        '201':
          description: Publicación creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '200':
          description: Reintento; ya existía (misma Idempotency-Key o mismo id).
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }
        '429':
          description: Límite diario alcanzado (`codigo` = limite_diario_alcanzado).
          headers:
            Retry-After:
              description: Segundos hasta que salga la publicación más antigua de la ventana.
              required: true
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - type: object
                    required: [reintentarEnSegundos]
                    properties:
                      reintentarEnSegundos: { type: integer, minimum: 1 }

  /v1/publicaciones/{id}/cancelar:
    post:
      tags: [solidaridad]
      operationId: cancelarPublicacion
      summary: Cancelar una publicación abierta propia
      description: |
        Solo el autor puede cancelar, dentro de su zona. Cambia a cancelada y sube la versión.
        Repetir una cancelación propia ya aceptada no falla ni genera otro evento.
        Devuelve 403 no_eres_el_autor o fuera_de_tu_zona; 409 no_se_puede_cancelar
        (con estadoActual) o conflicto_de_version (con versionActual).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioDeEstadoPublicacion' }
      responses:
        '200':
          description: Publicación cancelada o cancelación ya aceptada.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/publicaciones/{id}/resolver:
    post:
      tags: [solidaridad]
      operationId: resolverFavor
      summary: Marcar como resuelto un favor en curso
      description: |
        Puede hacerlo el autor o quien tomó el favor, dentro de su zona. Cambia a resuelta
        y sube la versión. Repetir una resolución propia ya aceptada no genera otro evento.
        Devuelve 403 no_participas_en_este_favor o fuera_de_tu_zona; 409 favor_no_en_curso
        (con estadoActual) o conflicto_de_version (con versionActual).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioDeEstadoPublicacion' }
      responses:
        '200':
          description: Favor resuelto o resolución ya aceptada.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/publicaciones/{id}/tomar:
    post:
      tags: [solidaridad]
      operationId: tomarFavor
      x-nivel-minimo: 1
      summary: Tomar un favor del muro
      description: |
        Requiere nivel de confianza mínimo 1. Sin token responde 401; con un nivel insuficiente
        responde 403 `nivel_de_confianza_insuficiente`. Un favor lo toma un solo vecino. Si dos
        lo toman sin conexión, el servidor decide: el primero gana; el segundo recibe 409 con
        `codigo: favor_no_disponible` (o `conflicto_de_version` si la publicación cambió).
        Repetir la acción ya aceptada no falla.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TomarFavor' }
      responses:
        '200':
          description: Favor tomado (o reintento de una acción ya aceptada).
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/dispositivos:
    post:
      tags: [notificaciones]
      operationId: registrarDispositivo
      summary: Registrar o reactivar un dispositivo del vecino autenticado
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, plataforma]
              properties:
                token: { $ref: '#/components/schemas/TokenDeDispositivo' }
                plataforma: { type: string, enum: [android, ios] }
      responses:
        '200':
          description: Registro vigente del dispositivo.
          content:
            application/json:
              schema:
                type: object
                required: [id, plataforma, registradoEn]
                properties:
                  id: { type: string, format: uuid }
                  plataforma: { type: string, enum: [android, ios] }
                  registradoEn: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/dispositivos/baja:
    post:
      tags: [notificaciones]
      operationId: darDeBajaDispositivo
      summary: Dar de baja el token del vecino antes de cerrar su sesión
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { $ref: '#/components/schemas/TokenDeDispositivo' }
      responses:
        '204': { description: 'Baja procesada, incluso si el vecino ya no tenía ese token activo.' }
        '200': { description: Reintento de una baja ya procesada. }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

