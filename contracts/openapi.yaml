openapi: 3.1.1
info:
  title: API de la app vecinal
  version: 0.1.0
  summary: Contrato de la Fase 0 (cimientos). Fuente de verdad para backend y app.
  description: |
    Contrato **primero el contrato, después el código**: cualquier cambio de la API se hace
    aquí en el mismo PR que lo implementa, y CI lo valida.

    Reglas que toda ruta cumple (sección 4.5 de la arquitectura):
    - `x-request-id` correlaciona respuesta y logs; cada problema incluye `requestId` y lo
      referencia en `instance`. Un problema repetido conserva su rechazo con una correlación nueva.
    - Errores en formato **Problem Details (RFC 9457)** con un `codigo` estable.
    - Toda escritura que el celular envía desde su cola offline exige `Idempotency-Key`.
      Un reintento con la misma clave y el mismo cuerpo devuelve la respuesta guardada
      (200 con `Idempotent-Replayed: true` si fue un éxito, o el mismo rechazo).
    - Cómo decide el celular: 2xx → *enviado*; 4xx salvo 408/429 → *no se pudo completar*
      (rechazo definitivo, va a "acciones por revisar"); red caída, 408, 429 y 5xx → se
      reintenta con espera exponencial y variación aleatoria.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000
    description: Desarrollo local (infra/docker-compose.yml + npm run start:dev)
tags:
  - name: plataforma
    description: Salud y claves públicas.
  - name: identidad
    description: Sesión y credenciales de sincronización.
  - name: solidaridad
    description: Muro de favores.
  - name: operacion
    description: Métricas operativas reservadas a administradores.
  - name: notificaciones
    description: Registro y baja de dispositivos para avisos personales.
security:
  - tokenDeAcceso: []

paths:
  /v1/salud:
    get:
      tags: [plataforma]
      operationId: revisarSalud
      summary: Estado de la API y de la base de datos
      security: []
      responses:
        '200':
          description: Todo funciona.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }
        '503':
          description: La base de datos no responde.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salud' }

  /.well-known/jwks.json:
    get:
      tags: [plataforma]
      operationId: obtenerJwks
      summary: Claves públicas (JWKS) para validar los JWT ES256
      description: La consulta PowerSync (`client_auth.jwks_uri`) para validar los tokens de sincronización.
      security: []
      responses:
        '200':
          description: Conjunto de claves públicas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }

  /v1/dev/sesiones:
    post:
      tags: [identidad]
      operationId: iniciarSesionDeDesarrollo
      summary: 'SOLO DESARROLLO: inicia sesión con el teléfono de un vecino sembrado'
      description: |
        Responde 404 cuando `ENABLE_DEV_SESSION` está apagado (siempre en producción).
        La reemplaza el inicio de sesión con OTP del Lote B.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudSesionDev' }
      responses:
        '201':
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /v1/sync/credenciales:
    get:
      tags: [identidad]
      operationId: obtenerCredencialesDeSincronizacion
      summary: Token para conectarse a PowerSync
      description: |
        Lo llama `fetchCredentials()` del conector de PowerSync. El token (audiencia `powersync`)
        lleva `sub` (vecino) y `zona`, que usan los Sync Streams; zona y nivel se releen de la
        base en cada emisión. Una familia de sesión revocada o vencida recibe 401
        (`codigo` = sesion_revocada), aunque su token de acceso aún no haya vencido.
      responses:
        '200':
          description: Credenciales vigentes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredencialesSincronizacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /v1/auth/otp:
    post:
      tags: [identidad]
      operationId: solicitarCodigo
      summary: Solicitar un código de un solo uso
      description: |
        Responde igual exista o no la cuenta para no revelar qué teléfonos están registrados.
        Un teléfono o una IP bloqueados por verificaciones fallidas reciben 429 hasta que termine
        el bloqueo, aunque el código anterior haya caducado.
        Esta ruta es en línea y no usa Idempotency-Key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudOtp' }
      responses:
        '202':
          description: Código aceptado para su envío.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpEnviado' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
        '503':
          description: El proveedor de mensajes no está disponible (`codigo` = servicio_no_disponible).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/auth/otp/verificar:
    post:
      tags: [identidad]
      operationId: verificarCodigo
      summary: Verificar un código e iniciar sesión
      description: |
        Devuelve acceso con claim `sid` (familia de sesión), refresh token opaco y usuario.
        Un código incorrecto, vencido o ya utilizado recibe la misma respuesta 401.
        Los fallos se acumulan por teléfono y por IP entre códigos distintos. Por defecto, cinco
        fallos por teléfono o veinte por IP en quince minutos bloquean durante quince minutos
        desde el fallo que alcanza el límite; los siguientes intentos reciben 429 y Retry-After.
        Esta ruta es en línea y no usa Idempotency-Key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificacionOtp' }
      responses:
        '200':
          description: Código verificado y sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionRenovable' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401':
          description: Código incorrecto, vencido o ya utilizado (`codigo` = codigo_invalido).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }

  /v1/auth/refrescar:
    post:
      tags: [identidad]
      operationId: refrescarSesion
      summary: Renovar el par de tokens y consumir el refresh anterior
      description: |
        Cada refresh token se usa una sola vez. Reutilizar uno ya rotado revoca toda su familia
        y responde 401 sesion_revocada. No hay ventana de gracia: el cliente debe serializar
        las renovaciones y guardar el refresh nuevo antes de usarlo. Si pierde la respuesta,
        debe iniciar sesión otra vez. Ruta en línea, sin Idempotency-Key ni reintento automático.
        Zona, nivel y roles se releen de la base al emitir el par nuevo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenovacionSesion' }
      responses:
        '200':
          description: Par de tokens nuevo; el refresh presentado queda consumido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SesionRenovable' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401':
          description: Refresh desconocido o vencido (sesion_invalida), revocado o reutilizado (sesion_revocada).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }

  /v1/auth/cerrar-sesion:
    post:
      tags: [identidad]
      operationId: cerrarSesion
      summary: Revocar la familia de sesión del dispositivo actual
      description: |
        Impide renovar tokens y obtener credenciales nuevas de PowerSync. El acceso ya emitido
        conserva su vigencia hasta expirar; las credenciales de PowerSync ya emitidas también.
        Operación en línea e idempotente. Una sesión de desarrollo sin sid no tiene familia.
      responses:
        '204': { description: Familia revocada o ya cerrada. }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /v1/auth/sesiones/revocar:
    post:
      tags: [identidad]
      operationId: revocarTodasLasSesiones
      summary: Revocar todas las familias de sesión del vecino
      description: |
        Incluye el dispositivo actual. Impide renovar tokens y obtener credenciales nuevas
        de PowerSync en todos los dispositivos. Los tokens ya emitidos conservan su vigencia
        hasta expirar. Operación en línea e idempotente.
      responses:
        '204': { description: Todas las familias revocadas. }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /v1/zonas:
    get:
      tags: [identidad]
      operationId: listarZonas
      summary: Listar las zonas disponibles
      description: La lista pública no incluye los polígonos de las zonas.
      security: []
      responses:
        '200':
          description: Zonas disponibles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Zona' }

  /v1/yo/zona:
    put:
      tags: [identidad]
      operationId: elegirZona
      summary: Elegir la zona del vecino una sola vez
      description: |
        Devuelve una sesión con un token de acceso que ya incluye la zona elegida.
        Conserva su familia `sid`; una familia revocada o vencida recibe 401 sesion_revocada.
        Cambiar de zona llega en la Fase 1. No rota el refresh token.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EleccionZona' }
      responses:
        '200':
          description: Zona elegida y token actualizado.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /v1/operacion/metricas:
    get:
      tags: [operacion]
      operationId: consultarMetricasOperativas
      summary: Métricas de idempotencia, outbox y colas para administradores
      description: |
        Exige el rol administrador. Los contadores de idempotencia corresponden a esta
        instancia desde su arranque; outbox y colas son lecturas actuales de PostgreSQL.
        No devuelve cargas de trabajos, cuerpos, claves de idempotencia ni tokens.
        Todas las rutas aceptan x-request-id de 1–128 caracteres ASCII seguros; si falta
        o es inválido se genera un UUIDv7. La respuesta lo devuelve y los problemas incluyen
        requestId y un instance que lo identifica. Los reintentos tienen su propio requestId.
      parameters:
        - name: x-request-id
          in: header
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      responses:
        '200':
          description: Instantánea operativa sin datos personales ni cargas de trabajos.
          headers:
            x-request-id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricasOperativas' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /v1/publicaciones:
    get:
      tags: [solidaridad]
      operationId: buscarPublicacionesCercanas
      summary: Buscar favores abiertos de tu zona por cercanía
      description: |
        Devuelve solo publicaciones abiertas, no eliminadas, con ubicación y sin vencer,
        ordenadas por distancia y luego por id. La distancia se redondea a múltiplos de 50 m;
        las ubicaciones publicadas ya son aproximadas. La posición de búsqueda no se guarda.
        El cursor es opaco y se debe reutilizar con el mismo punto y radio. Es una lectura
        en línea; el cursor no representa una instantánea del muro.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radio
          in: query
          schema: { type: integer, minimum: 100, maximum: 5000, default: 2000 }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Página de favores cercanos, posiblemente vacía.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDePublicaciones' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [solidaridad]
      operationId: publicarEnElMuro
      x-nivel-minimo: 1
      summary: Publicar en el muro de favores (tercer toque)
      description: |
        El `id` lo genera el celular (UUIDv7). Si la publicación ya existía (reintento), responde
        200 con la existente: nunca se duplica. Requiere nivel de confianza mínimo 1 y una zona.
        Sin token responde 401; con un nivel insuficiente responde 403
        `nivel_de_confianza_insuficiente`.
        El límite por autor es una ventana móvil de 24 horas (10 por defecto), incluidas
        publicaciones canceladas o eliminadas. Un reintento del mismo id no consume otra plaza.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaPublicacion' }
      responses:
        '201':
          description: Publicación creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '200':
          description: Reintento; ya existía (misma Idempotency-Key o mismo id).
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }
        '429':
          description: Límite diario alcanzado (`codigo` = limite_diario_alcanzado).
          headers:
            Retry-After:
              description: Segundos hasta que salga la publicación más antigua de la ventana.
              required: true
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problema'
                  - type: object
                    required: [reintentarEnSegundos]
                    properties:
                      reintentarEnSegundos: { type: integer, minimum: 1 }

  /v1/publicaciones/{id}/cancelar:
    post:
      tags: [solidaridad]
      operationId: cancelarPublicacion
      summary: Cancelar una publicación abierta propia
      description: |
        Solo el autor puede cancelar, dentro de su zona. Cambia a cancelada y sube la versión.
        Repetir una cancelación propia ya aceptada no falla ni genera otro evento.
        Devuelve 403 no_eres_el_autor o fuera_de_tu_zona; 409 no_se_puede_cancelar
        (con estadoActual) o conflicto_de_version (con versionActual).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioDeEstadoPublicacion' }
      responses:
        '200':
          description: Publicación cancelada o cancelación ya aceptada.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/publicaciones/{id}/resolver:
    post:
      tags: [solidaridad]
      operationId: resolverFavor
      summary: Marcar como resuelto un favor en curso
      description: |
        Puede hacerlo el autor o quien tomó el favor, dentro de su zona. Cambia a resuelta
        y sube la versión. Repetir una resolución propia ya aceptada no genera otro evento.
        Devuelve 403 no_participas_en_este_favor o fuera_de_tu_zona; 409 favor_no_en_curso
        (con estadoActual) o conflicto_de_version (con versionActual).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CambioDeEstadoPublicacion' }
      responses:
        '200':
          description: Favor resuelto o resolución ya aceptada.
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/publicaciones/{id}/tomar:
    post:
      tags: [solidaridad]
      operationId: tomarFavor
      x-nivel-minimo: 1
      summary: Tomar un favor del muro
      description: |
        Requiere nivel de confianza mínimo 1. Sin token responde 401; con un nivel insuficiente
        responde 403 `nivel_de_confianza_insuficiente`. Un favor lo toma un solo vecino. Si dos
        lo toman sin conexión, el servidor decide: el primero gana; el segundo recibe 409 con
        `codigo: favor_no_disponible` (o `conflicto_de_version` si la publicación cambió).
        Repetir la acción ya aceptada no falla.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TomarFavor' }
      responses:
        '200':
          description: Favor tomado (o reintento de una acción ya aceptada).
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publicacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/dispositivos:
    post:
      tags: [notificaciones]
      operationId: registrarDispositivo
      summary: Registrar o reactivar un dispositivo del vecino autenticado
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, plataforma]
              properties:
                token: { $ref: '#/components/schemas/TokenDeDispositivo' }
                plataforma: { type: string, enum: [android, ios] }
      responses:
        '200':
          description: Registro vigente del dispositivo.
          content:
            application/json:
              schema:
                type: object
                required: [id, plataforma, registradoEn]
                properties:
                  id: { type: string, format: uuid }
                  plataforma: { type: string, enum: [android, ios] }
                  registradoEn: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

  /v1/dispositivos/baja:
    post:
      tags: [notificaciones]
      operationId: darDeBajaDispositivo
      summary: Dar de baja el token del vecino antes de cerrar su sesión
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { $ref: '#/components/schemas/TokenDeDispositivo' }
      responses:
        '204': { description: 'Baja procesada, incluso si el vecino ya no tenía ese token activo.' }
        '200': { description: Reintento de una baja ya procesada. }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/NoProcesable' }

components:
  securitySchemes:
    tokenDeAcceso:
      type: http
      scheme: bearer
      bearerFormat: JWT ES256 (audiencia vecinal-api, 15 minutos)

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUIDv7 generado en el celular, uno por acción; todos los reintentos usan el mismo.
      schema: { type: string, minLength: 8, maxLength: 255 }

  headers:
    RequestId:
      description: Identificador de la solicitud, también presente en errores y logs JSON.
      schema: { type: string }
    IdempotentReplayed:
      description: '`true` cuando la respuesta es la guardada de un intento anterior.'
      schema: { type: string, enum: ['true'] }

  responses:
    SolicitudInvalida:
      description: Datos inválidos o falta Idempotency-Key (`codigo` = validacion).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaDeValidacion' }
    NoAutenticado:
      description: Falta el token o venció (`codigo` = no_autenticado).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    DemasiadasSolicitudes:
      description: Se superó un límite de solicitudes (`codigo` = demasiados_intentos).
      headers:
        Retry-After:
          description: Segundos que deben transcurrir antes de reintentar.
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problema'
              - type: object
                required: [reintentarEnSegundos]
                properties:
                  reintentarEnSegundos:
                    type: integer
                    minimum: 1
                    description: Segundos que deben transcurrir antes de reintentar.
    Prohibido:
      description: |
        El vecino no puede hacer esto. `nivel_de_confianza_insuficiente` incluye `nivelActual` y
        `nivelRequerido`; `rol_requerido` incluye `rolesRequeridos`. Otros códigos posibles son
        `fuera_de_tu_zona` y `no_eres_el_autor`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: El recurso no existe (`codigo` = recurso_no_encontrado).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflicto:
      description: |
        El estado actual lo impide: favor_no_disponible, conflicto_de_version, id_en_uso o
        solicitud_en_curso (este último trae `Retry-After` y sí se reintenta).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoProcesable:
      description: Regla de negocio incumplida o Idempotency-Key reutilizada con otro contenido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:
    MetricasOperativas:
      type: object
      required: [instanciaId, desde, generadoEn, idempotencia, outbox, colasMotor, colas]
      properties:
        instanciaId: { type: string, format: uuid }
        desde: { type: string, format: date-time }
        generadoEn: { type: string, format: date-time }
        idempotencia:
          type: object
          required: [nueva, repetida, enCurso, huellaDistinta]
          properties:
            nueva: { type: integer, minimum: 0 }
            repetida: { type: integer, minimum: 0 }
            enCurso: { type: integer, minimum: 0 }
            huellaDistinta: { type: integer, minimum: 0 }
        outbox:
          type: object
          required: [pendientes, edadMasAntiguoSegundos]
          properties:
            pendientes: { type: integer, minimum: 0 }
            edadMasAntiguoSegundos: { type: [number, 'null'], minimum: 0 }
        colasMotor: { type: string, enum: [pgboss, memory], description: memory solo existe en pruebas. }
        colas:
          type: array
          items:
            type: object
            required: [nombre, pendientes, activas, fallidas, criticasPendientes, edadCriticaMasAntiguaSegundos]
            properties:
              nombre: { type: string }
              pendientes: { type: integer, minimum: 0, description: Incluye trabajos diferidos y en reintento; excluye activos. }
              activas: { type: integer, minimum: 0 }
              fallidas: { type: integer, minimum: 0 }
              criticasPendientes: { type: integer, minimum: 0 }
              edadCriticaMasAntiguaSegundos:
                type: [number, 'null']
                minimum: 0
                description: Edad del trabajo crítico elegible más antiguo; nulo si no hay ninguno listo.
    TokenDeDispositivo:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: '^[!-~]+$'
      writeOnly: true
    Problema:
      type: object
      description: Problem Details (RFC 9457) con un código estable para el celular.
      required: [type, title, status, codigo]
      properties:
        type: { type: string, examples: ['/problemas/favor-no-disponible'] }
        title: { type: string, examples: ['Conflicto'] }
        status: { type: integer, examples: [409] }
        detail: { type: string, examples: ['Otro vecino ya tomó este favor o ya no está disponible.'] }
        instance: { type: string, examples: ['/v1/publicaciones#requestId=01970000-0000-7000-8000-000000000001'] }
        requestId: { type: string, description: 'Identificador de esta solicitud, incluso al repetir un rechazo guardado.' }
        codigo: { type: string, examples: ['favor_no_disponible'] }
        nivelActual:
          type: integer
          minimum: 0
          maximum: 3
          description: Nivel del vecino cuando el código es `nivel_de_confianza_insuficiente`.
        nivelRequerido:
          type: integer
          minimum: 0
          maximum: 3
          description: Nivel mínimo exigido cuando el código es `nivel_de_confianza_insuficiente`.
        rolesRequeridos:
          type: array
          items:
            type: string
            enum: [proveedor, moderador, coordinador, brigadista, administrador]
          description: Roles aceptados cuando el código es `rol_requerido`; basta tener uno.
      additionalProperties: true

    ProblemaDeValidacion:
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          required: [errores]
          properties:
            errores:
              type: array
              items:
                type: object
                required: [campo, mensaje]
                properties:
                  campo: { type: string, examples: ['titulo'] }
                  mensaje: { type: string }

    Salud:
      type: object
      required: [estado, baseDeDatos, hora]
      properties:
        estado: { type: string, enum: [ok, degradado] }
        baseDeDatos: { type: string, enum: [ok, caida] }
        hora: { type: string, format: date-time }

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, y, kid, alg, use]
            properties:
              kty: { type: string, const: EC }
              crv: { type: string, const: P-256 }
              x: { type: string }
              y: { type: string }
              kid: { type: string }
              alg: { type: string, const: ES256 }
              use: { type: string, const: sig }

    SolicitudSesionDev:
      type: object
      required: [telefono]
      properties:
        telefono: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', examples: ['+51900000002'] }

    SolicitudOtp:
      type: object
      required: [telefono]
      properties:
        telefono:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          examples: ['+51987654321']
        canal:
          type: string
          enum: [sms, whatsapp]
          default: sms

    OtpEnviado:
      type: object
      required: [reintentarEnSegundos, expiraEnSegundos]
      properties:
        reintentarEnSegundos: { type: integer, minimum: 1, examples: [60] }
        expiraEnSegundos: { type: integer, minimum: 1, examples: [300] }

    VerificacionOtp:
      type: object
      required: [telefono, codigo]
      properties:
        telefono:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          examples: ['+51987654321']
        codigo: { type: string, pattern: '^[0-9]{6}$', examples: ['123456'] }
        dispositivo: { type: string, maxLength: 80 }

    Zona:
      type: object
      required: [id, nombre, distrito]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        distrito: { type: string }

    EleccionZona:
      type: object
      required: [zonaId]
      properties:
        zonaId: { type: string, format: uuid }

    Sesion:
      type: object
      required: [tokenDeAcceso, expiraEn, usuario]
      properties:
        tokenDeAcceso: { type: string }
        expiraEn: { type: string, format: date-time }
        refreshToken: { type: string, description: Token opaco; solo presente al verificar OTP o renovar. }
        refreshExpiraEn: { type: string, format: date-time }
        usuario:
          type: object
          required: [id, nombreVisible, zonaId, nivel, roles]
          properties:
            id: { type: string, format: uuid }
            nombreVisible: { type: string }
            zonaId: { type: [string, 'null'], format: uuid }
            nivel: { type: integer, minimum: 0, maximum: 3 }
            roles:
              type: array
              items: { type: string, enum: [proveedor, moderador, coordinador, brigadista, administrador] }

    SesionRenovable:
      allOf:
        - $ref: '#/components/schemas/Sesion'
        - type: object
          required: [refreshToken, refreshExpiraEn]

    RenovacionSesion:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 512 }

    CredencialesSincronizacion:
      type: object
      required: [endpoint, token, expiraEn]
      properties:
        endpoint: { type: string, format: uri, description: URL del servicio de PowerSync. }
        token: { type: string, description: 'JWT ES256, audiencia powersync, claims sub y zona.' }
        expiraEn: { type: string, format: date-time }

    TipoPublicacion:
      type: string
      enum: [ofrezco, necesito, presto, dono, intercambio, movilidad]

    Coordenadas:
      type: object
      description: Se guardan redondeadas a ~100 m; nunca la ubicación exacta de una persona.
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    NuevaPublicacion:
      type: object
      required: [id, tipo, categoria, titulo]
      properties:
        id: { type: string, format: uuid, description: UUIDv7 generado en el celular. }
        tipo: { $ref: '#/components/schemas/TipoPublicacion' }
        categoria: { type: string, minLength: 2, maxLength: 40, examples: [herramientas] }
        titulo: { type: string, minLength: 3, maxLength: 120 }
        descripcion: { type: [string, 'null'], maxLength: 2000 }
        ubicacion:
          oneOf:
            - $ref: '#/components/schemas/Coordenadas'
            - type: 'null'
        venceEn: { type: [string, 'null'], format: date-time }

    TomarFavor:
      type: object
      required: [versionVista]
      properties:
        versionVista:
          type: integer
          minimum: 1
          description: Versión de la publicación que el vecino veía cuando tocó "Tomar".

    CambioDeEstadoPublicacion:
      type: object
      required: [versionVista]
      properties:
        versionVista: { type: integer, minimum: 1 }

    PublicacionCercana:
      allOf:
        - $ref: '#/components/schemas/Publicacion'
        - type: object
          required: [distanciaMetros]
          properties:
            distanciaMetros: { type: integer, minimum: 0, multipleOf: 50 }

    PaginaDePublicaciones:
      type: object
      required: [datos, siguienteCursor]
      properties:
        datos:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PublicacionCercana' }
        siguienteCursor: { type: [string, 'null'] }

    Publicacion:
      type: object
      required:
        [id, autorId, zonaId, tipo, categoria, titulo, descripcion, ubicacion, estado,
         tomadaPorId, version, venceEn, creadoEn, actualizadoEn]
      properties:
        id: { type: string, format: uuid }
        autorId: { type: string, format: uuid }
        zonaId: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoPublicacion' }
        categoria: { type: string }
        titulo: { type: string }
        descripcion: { type: [string, 'null'] }
        ubicacion:
          oneOf:
            - $ref: '#/components/schemas/Coordenadas'
            - type: 'null'
        estado: { type: string, enum: [abierta, en_curso, resuelta, cancelada] }
        tomadaPorId: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 1 }
        venceEn: { type: [string, 'null'], format: date-time }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
