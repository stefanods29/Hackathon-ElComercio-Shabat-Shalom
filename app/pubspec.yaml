name: vecinal
description: App vecinal de servicios, solidaridad y emergencias (Fase 0 · cimientos).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

# Los paquetes de cada lote (powersync, maplibre_gl, firebase_messaging, showcaseview…) los
# agrega el lote dueño con `flutter pub add`, en su propia rama, y se revisan en su PR.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  dio: ^5.11.1
  uuid: ^4.6.0
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.6
  powersync: 2.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite_async: ^0.14.8
  showcaseview: ^5.1.0
  shared_preferences: ^2.5.6
  maplibre_gl: ^0.28.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.0
  firebase_messaging: ^17.0.1
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  speech_to_text: ^7.5.0
  flutter_image_compress: ^2.5.1
  background_downloader: ^9.6.6
  cryptography: ^2.9.0
  sentry: ^10.3.0
  flutter_blurhash: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/emergencia/respaldo.json
    - assets/public/emergency_directory.json
    - assets/public/tutorial.json

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
